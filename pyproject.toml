[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "simple-harness-memory-sdk"
dynamic = ["version"]
description = "Cognitive memory SDK for Simple Harness — three-tier model, Digital Twin, World Model, RRF recall"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "BUSL-1.1"
license-files = ["LICENSES/BUSL-1.1.txt"]
authors = [{ name = "Denny" }]

dependencies = [
    "aiosqlite>=0.19",
    "pydantic>=2.0",
    "numpy>=1.24",
    "structlog>=24.0",
    "simple-harness-sdk>=0.4,<0.5",
]

[project.optional-dependencies]
embeddings = [
    "torch>=2.7.1",
    "sentence-transformers>=3.0",
]
world = [
    "httpx>=0.27",
    "python-dateutil>=2.9",
]
openai = [
    "openai>=1.0",
]
harness = [
    "simple-harness-sdk>=0.4,<0.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
    "ruff==0.16.3",
    "mypy==1.20.2",
    "simple-harness-sdk>=0.4,<0.5",
]
all = [
    "simple-harness-memory-sdk[embeddings,world,openai,harness]",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
    "ruff==0.16.3",
    "mypy==1.20.2",
    "simple-harness-sdk>=0.4,<0.5",
]

[tool.uv.sources]
simple-harness-sdk = { path = "../simple-harness-sdk" }

[tool.hatch.build.targets.wheel]
packages = ["src/simple_harness_memory"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.version]
path = "src/simple_harness_memory/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
