[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simple-harness-memory-sdk"
dynamic = ["version"]
description = "Cognitive memory SDK for Simple Harness — three-tier model, Digital Twin, World Model, RRF recall"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BUSL-1.1" }
authors = [{ name = "Denny" }]

dependencies = [
    "aiosqlite>=0.19",
    "pydantic>=2.0",
    "numpy>=1.24",
    "structlog>=24.0",
]

[project.optional-dependencies]
embeddings = [
    "torch>=2.7.1",
    "sentence-transformers>=3.0",
]
world = [
    "httpx>=0.27",
    "python-dateutil>=2.9",
]
openai = [
    "openai>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
]
all = [
    "simple-harness-memory-sdk[embeddings,world,openai]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/simple_harness_memory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.version]
path = "src/simple_harness_memory/__init__.py"
