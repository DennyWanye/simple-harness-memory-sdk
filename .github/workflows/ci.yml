name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout private Harness 0.7 source (fail closed without repository access)
        uses: actions/checkout@v4
        with:
          repository: DennyWanye/simple-harness-sdk
          ref: 8f1027d2d64ca3a7e7a4d161833507eadac9552b
          path: harness-sdk
          token: ${{ secrets.HARNESS_REPOSITORY_TOKEN || github.token }}
      - name: Bind exact Harness 0.7 source for uv
        run: ln -s "$GITHUB_WORKSPACE/harness-sdk" "$GITHUB_WORKSPACE/../simple-harness-sdk-memory-program"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
      - run: uv sync --frozen --group dev
      - run: uv run --frozen --group dev pytest -q
      - run: uv run --frozen --group dev ruff check src tests
      - run: uv run --frozen --group dev mypy src tests
      - run: uv run --frozen --group dev ruff check scripts
      - run: >-
          uv run --frozen --group dev mypy --strict
          scripts/harness_compatibility_consumer.py
          scripts/verify_harness_compatibility.py
          scripts/write_candidate_metadata.py

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
      - run: uvx --from "reuse>=5,<6" reuse lint

  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout private Harness 0.7 source (fail closed without repository access)
        uses: actions/checkout@v4
        with:
          repository: DennyWanye/simple-harness-sdk
          ref: 8f1027d2d64ca3a7e7a4d161833507eadac9552b
          path: harness-sdk
          token: ${{ secrets.HARNESS_REPOSITORY_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
      - name: Bind and build exact Harness 0.7 artifact
        run: |
          test "$(git -C harness-sdk rev-parse HEAD)" = "8f1027d2d64ca3a7e7a4d161833507eadac9552b"
          ln -s "$GITHUB_WORKSPACE/harness-sdk" "$GITHUB_WORKSPACE/../simple-harness-sdk-memory-program"
          SOURCE_DATE_EPOCH=315532800 uv build --wheel --project harness-sdk --out-dir harness-dist
          test "$(find harness-dist -maxdepth 1 -name 'simple_harness_sdk-0.7.0-*.whl' | wc -l)" = "1"
          echo "b9421ddf2b1d5a4a4a0920a2e878c1d3cf098ff6ef0af8975b9eb5c516037d7b  harness-dist/simple_harness_sdk-0.7.0-py3-none-any.whl" | sha256sum --check
      - name: Build candidate bytes once
        run: uv build --out-dir candidate-dist
      - name: Validate candidate distributions
        run: uvx --from "twine>=6.1,<7" twine check candidate-dist/*
      - name: Record candidate identity and checksums
        run: >-
          python scripts/write_candidate_metadata.py
          --dist candidate-dist
          --source-commit "${{ github.sha }}"
          --build-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Test exact wheel and authoritative metadata contracts
        env:
          MEMORY_SDK_ARTIFACT_DIST: candidate-dist
          HARNESS_SDK_ARTIFACT_DIST: harness-dist
          MEMORY_SDK_CI_CANDIDATE: "1"
        run: >-
          uv run --frozen --group dev pytest -q
          tests/artifact
      - name: Verify exact wheel in a clean environment
        run: |
          cd candidate-dist
          sha256sum --check SHA256SUMS
          cd ..
          uv venv .candidate-venv --python 3.13
          WHEEL="$(find candidate-dist -maxdepth 1 -name '*.whl' -print -quit)"
          HARNESS_WHEEL="$(find harness-dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv pip install --python .candidate-venv/bin/python "$HARNESS_WHEEL" "$WHEEL"
          .candidate-venv/bin/python -I - <<'PY'
          import asyncio
          import os
          import sqlite3
          import tempfile
          from pathlib import Path

          from simple_harness_memory import __version__
          from simple_harness_memory.backends.sqlite import SQLiteMemoryBackend

          async def verify() -> None:
              root = Path(tempfile.mkdtemp(prefix="memory-wheel-"))
              path = root / "memory.db"
              backend = SQLiteMemoryBackend(str(path))
              await backend.initialize()
              applied = await backend.append_message(
                  "session-1", "user", "hello", user_id="user-1", source_event_id="event-1"
              )
              assert applied.status.value == "applied"
              await backend.close()
              assert __version__ == "0.6.0"
              assert os.stat(path).st_mode & 0o777 == 0o600
              with sqlite3.connect(path) as connection:
                  assert connection.execute("PRAGMA journal_mode").fetchone()[0] == "wal"
                  assert not connection.execute("PRAGMA foreign_key_check").fetchall()

          asyncio.run(verify())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: memory-sdk-candidate-${{ github.sha }}
          path: candidate-dist/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: harness-sdk-candidate-${{ github.sha }}
          path: harness-dist/*.whl
          if-no-files-found: error
          retention-days: 30

  exact-wheel-platform-matrix:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            expected-machine: x86_64
          - os: windows-latest
            python-version: "3.12"
            expected-machine: AMD64
          - os: macos-14
            python-version: "3.13"
            expected-machine: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
      - uses: actions/download-artifact@v4
        with:
          name: memory-sdk-candidate-${{ github.sha }}
          path: candidate-dist
      - uses: actions/download-artifact@v4
        with:
          name: harness-sdk-candidate-${{ github.sha }}
          path: harness-dist
      - name: Verify and consume the exact candidate wheel
        shell: bash
        env:
          EXPECTED_MACHINE: ${{ matrix.expected-machine }}
        run: |
          python - <<'PY'
          import hashlib
          import platform
          from pathlib import Path

          root = Path("candidate-dist")
          assert platform.machine() == __import__("os").environ["EXPECTED_MACHINE"]
          for line in (root / "SHA256SUMS").read_text().splitlines():
              digest, name = line.split("  ", 1)
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest
          PY
          WHEEL="$(find candidate-dist -maxdepth 1 -name '*.whl' -print -quit)"
          HARNESS_WHEEL="$(find harness-dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv pip install --system "$HARNESS_WHEEL" "$WHEEL"
          python -I - <<'PY'
          import asyncio
          import importlib.metadata as metadata
          import importlib.util
          import platform
          import sqlite3
          import tempfile
          from pathlib import Path

          import simple_harness_memory
          from simple_harness_memory import MemoryManager

          assert metadata.version("simple-harness-memory-sdk") == "0.6.0"
          assert metadata.version("simple-harness-sdk") == "0.7.0"
          assert "site-packages" in simple_harness_memory.__file__
          assert importlib.util.find_spec("simple_harness.observability") is not None
          assert sqlite3.sqlite_version_info >= (3, 35)

          async def verify() -> None:
              path = Path(tempfile.mkdtemp(prefix="memory-matrix-")) / "memory.db"
              manager = await MemoryManager.build(path)
              await manager.close()

          asyncio.run(verify())
          print(platform.python_version(), sqlite3.sqlite_version)
          PY

  harness-0-7-compatibility:
    name: Memory 0.6.0 / Harness 0.7.0 exact wheels
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
      - uses: actions/download-artifact@v4
        with:
          name: memory-sdk-candidate-${{ github.sha }}
          path: candidate-dist
      - uses: actions/download-artifact@v4
        with:
          name: harness-sdk-candidate-${{ github.sha }}
          path: harness-dist
      - name: Verify the H0.7 / Memory candidate cell in a clean environment
        run: |
          MEMORY_WHEEL="$(find candidate-dist -maxdepth 1 -name '*.whl' -print -quit)"
          MEMORY_SHA256="$(sha256sum "$MEMORY_WHEEL" | awk '{print $1}')"
          HARNESS_WHEEL="$(find harness-dist -maxdepth 1 -name '*.whl' -print -quit)"
          HARNESS_SHA256="$(sha256sum "$HARNESS_WHEEL" | awk '{print $1}')"
          python scripts/verify_harness_compatibility.py \
            --memory-wheel "$MEMORY_WHEEL" \
            --memory-sha256 "$MEMORY_SHA256" \
            --expected-memory-version 0.6.0 \
            --harness-wheel "$HARNESS_WHEEL" \
            --harness-sha256 "$HARNESS_SHA256" \
            --expected-harness-version 0.7.0 \
            --python 3.11

  linux-arm64-core:
    needs: candidate
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
      - uses: actions/download-artifact@v4
        with:
          name: memory-sdk-candidate-${{ github.sha }}
          path: candidate-dist
      - uses: actions/download-artifact@v4
        with:
          name: harness-sdk-candidate-${{ github.sha }}
          path: harness-dist
      - name: Install and verify the same ARM64 candidate bytes
        run: |
          test "$(uname -m)" = "aarch64"
          cd candidate-dist
          sha256sum --check SHA256SUMS
          cd ..
          uv venv .arm64-venv --python 3.13
          WHEEL="$(find candidate-dist -maxdepth 1 -name '*.whl' -print -quit)"
          HARNESS_WHEEL="$(find harness-dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv pip install --python .arm64-venv/bin/python "$HARNESS_WHEEL" "$WHEEL"
          .arm64-venv/bin/python -I - <<'PY'
          import asyncio
          import os
          import sqlite3
          import tempfile
          from pathlib import Path

          from simple_harness_memory.backends.sqlite import SQLiteMemoryBackend

          async def verify() -> None:
              path = Path(tempfile.mkdtemp(prefix="memory-arm64-")) / "memory.db"
              backend = SQLiteMemoryBackend(str(path))
              await backend.initialize()
              from simple_harness_memory import MemoryPrincipal, MemoryScope

              principal = MemoryPrincipal("deployment-a", "household-a", "actor-a", "session-a")
              first = await backend.agent_record_turn(
                  principal=principal,
                  scope=MemoryScope.personal("actor-a"),
                  turn_id="turn-a",
                  payload_hash="a" * 64,
                  user_text="arm64 user",
                  assistant_text="arm64 assistant",
                  write_fence=None,
                  turn_started_at=0.0,
              )
              replay = await backend.agent_record_turn(
                  principal=principal,
                  scope=MemoryScope.personal("actor-a"),
                  turn_id="turn-a",
                  payload_hash="a" * 64,
                  user_text="arm64 user",
                  assistant_text="arm64 assistant",
                  write_fence=None,
                  turn_started_at=0.0,
              )
              assert first == ("applied", "memory-turn/v1/turn-a")
              assert replay == ("already_applied", "memory-turn/v1/turn-a")
              await backend.close()
              reopened = SQLiteMemoryBackend(str(path))
              await reopened.initialize()
              async with reopened._conn.execute(
                  "SELECT deployment_id, household_id, actor_id, session_id, status "
                  "FROM turn_receipts WHERE deployment_id='deployment-a' AND turn_id='turn-a'"
              ) as cursor:
                  assert tuple(await cursor.fetchone()) == (
                      "deployment-a", "household-a", "actor-a", "session-a", "applied"
                  )
              async with reopened._conn.execute("SELECT COUNT(*) FROM messages") as cursor:
                  assert (await cursor.fetchone())[0] == 2
              await reopened.close()
              assert os.stat(path).st_mode & 0o777 == 0o600
              with sqlite3.connect(path) as connection:
                  assert connection.execute("PRAGMA journal_mode").fetchone()[0] == "wal"
                  assert not connection.execute("PRAGMA foreign_key_check").fetchall()

          asyncio.run(verify())
          PY
