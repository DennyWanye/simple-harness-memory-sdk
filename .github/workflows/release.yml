name: Release frozen candidate

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful CI run that owns the frozen candidate
        required: true
        type: string
      artifact_id:
        description: Exact retained Actions artifact ID
        required: true
        type: string
      wheel_sha256:
        description: Expected lowercase SHA-256 of the wheel
        required: true
        type: string
      source_commit:
        description: Exact source commit recorded by CI
        required: true
        type: string
      release_tag:
        description: Immutable release tag (must be v0.3.0)
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  verify-and-publish:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: frozen-dist
      - name: Verify frozen artifact identity
        env:
          EXPECTED_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_SHA256: ${{ inputs.wheel_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$RELEASE_TAG" = "v0.3.0"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(find frozen-dist -name '*.whl' | wc -l)" -eq 1
          DIST="$(dirname "$(find frozen-dist -name '*.whl' -print -quit)")"
          cd "$DIST"
          sha256sum --check SHA256SUMS
          WHEEL="$(find . -maxdepth 1 -name '*.whl' -print -quit)"
          test "$(sha256sum "$WHEEL" | awk '{print $1}')" = "$EXPECTED_SHA256"
          grep -Fx "package=simple-harness-memory-sdk" BUILD_INFO.txt
          grep -Fx "version=0.3.0" BUILD_INFO.txt
          grep -Fx "source_commit=$EXPECTED_COMMIT" BUILD_INFO.txt
          grep -Fx "requires_python=>=3.11,<3.14" BUILD_INFO.txt
          grep -Ex 'build_utc=[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z' BUILD_INFO.txt
          grep -Fx "wheel_sha256=$EXPECTED_SHA256" BUILD_INFO.txt
      - name: Publish the verified original bytes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ inputs.source_commit }}
          fail_on_unmatched_files: true
          files: |
            frozen-dist/**/*.whl
            frozen-dist/**/*.tar.gz
            frozen-dist/**/SHA256SUMS
            frozen-dist/**/BUILD_INFO.txt
