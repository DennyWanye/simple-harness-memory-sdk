name: Verify frozen candidate for single publisher

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful CI run that owns the frozen candidate
        required: true
        type: string
      artifact_id:
        description: Exact retained Actions artifact ID
        required: true
        type: string
      wheel_sha256:
        description: Expected lowercase SHA-256 of the wheel
        required: true
        type: string
      source_commit:
        description: Exact source commit recorded by CI
        required: true
        type: string
permissions:
  actions: read
  contents: read

jobs:
  verify-for-single-publisher:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: frozen-dist
      - name: Verify frozen artifact identity
        env:
          EXPECTED_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_SHA256: ${{ inputs.wheel_sha256 }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(find frozen-dist -name '*.whl' | wc -l)" -eq 1
          DIST="$(dirname "$(find frozen-dist -name '*.whl' -print -quit)")"
          cd "$DIST"
          sha256sum --check SHA256SUMS
          WHEEL="$(find . -maxdepth 1 -name '*.whl' -print -quit)"
          test "$(sha256sum "$WHEEL" | awk '{print $1}')" = "$EXPECTED_SHA256"
          grep -Fx "package=simple-harness-memory-sdk" BUILD_INFO.txt
          grep -Fx "version=0.5.1" BUILD_INFO.txt
          grep -Fx "source_commit=$EXPECTED_COMMIT" BUILD_INFO.txt
          grep -Fx "requires_python=<3.14,>=3.11" BUILD_INFO.txt
          grep -Fx "harness_requires=simple-harness-sdk<0.6,>=0.4" BUILD_INFO.txt
          grep -Ex 'build_utc=[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z' BUILD_INFO.txt
          grep -Fx "wheel_sha256=$EXPECTED_SHA256" BUILD_INFO.txt
      - name: Upload verified bytes for the Task 10 single publisher
        uses: actions/upload-artifact@v4
        with:
          name: memory-sdk-verified-${{ inputs.source_commit }}
          path: |
            frozen-dist/**/*.whl
            frozen-dist/**/*.tar.gz
            frozen-dist/**/SHA256SUMS
            frozen-dist/**/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
